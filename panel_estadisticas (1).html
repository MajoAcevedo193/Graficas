
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background: #FCFAF2;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      background: #934D31;
      padding: 12px;
      border-radius: 8px;
      margin: 10px;
      display: inline-block;
      min-width: 100px;
    }
    .title {
      font-size: 14px;
      font-weight: bold;
      color: #FCFAF2;
    }
    .value {
      font-size: 16px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">Dataset</div>
    <div class="value">234,005 filas • 136,451 tickets</div>
  </div>

  <div class="card">
    <div class="title">Rango de Fechas</div>
    <div class="value">2021-01-02 → 2022-09-30</div>
  </div>

  <div class="card">
    <div class="title">Promedio Diario</div>
    <div class="value">931.07 €</div>
  </div>

  <div class="card">
    <div class="title">Artículo más vendido</div>
    <div class="value">TRADITIONAL BAGUETTE</div>
  </div>

</body>
</html>
